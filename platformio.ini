; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = COM11
upload_port = COM11
upload_speed = 460800
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit_VL53L0X

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -std=gnu++11

; Entorno solo para simulación Wokwi.
; Wokwi no tiene parte VL53L0X, así que este env compila
; main.cpp con -DWOKWI_SIM: la misma máquina de estados
; (IDLE/A_FIRST/B_FIRST/WAIT_CLEAR) pero con botones + OLED.
[env:wokwi]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DWOKWI_SIM
lib_deps =
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    adafruit/Adafruit_VL53L0X